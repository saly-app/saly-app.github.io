    <style>
        /* * 1. FONT FACE DECLARATIONS */
        @font-face {
            font-family: 'AKbalthomKhmerHand';
            /* Try loading from the root and then from the font/ folder */
            src: url('AKbalthomKhmerHand.ttf') format('truetype'),
                 url('font/AKbalthomKhmerHand.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Moul';
            /* Assuming 'Moul.ttf' is also in your font folder for the names in the first invitation */
            src: url('Moul.ttf') format('truetype'),
                 url('font/Moul.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        /* * 2. TAILWIND CONFIGURATION */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sage': '#6a8273', /* Primary Color */
                        'off-white': '#fdfdfa', /* Background Color */
                        'text-dark': '#333',
                        /* Custom color for menu items based on the image */
                        'menu-gold': '#efc455', 
                        'menu-bg': 'rgba(106, 130, 115, 0.7)', /* Sage with transparency */
                    },
                    fontFamily: {
                        'header': ['"Playfair Display"', 'serif'],
                        'body': ['Montserrat', 'sans-serif'],
                        /* Custom local font for the main Khmer header */
                        'khmer-script': ['Moulpali','AKbalthomKhmerHand','AKbalthomFreehand','AKbalthomKhmerLer','Moul', 'serif', 'system-ui'],
                        /* Noto Sans Khmer web font for the body text */
                        'khmer': ['"Noto Sans Khmer"', 'sans-serif', 'system-ui'], 
                    },
                },
            }
        }
        /* Custom styles to ensure smooth scrolling and responsive hero background */
        html {
            scroll-behavior: smooth;
        }
        
        /* Custom Timeline Styles (Kept for completeness, though not heavily used in this layout) */
        .timeline-container:before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.4); 
            transform: translateX(-50%);
        }
        .timeline-item-icon {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .modal-content-wrapper {
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3. BUTTON ANIMATION KEYFRAMES */
        @keyframes pulseZoom {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05); /* Zooms in 5% */
            }
            100% {
                transform: scale(1); /* Zooms back out */
            }
        }

        .animate-zoom-pulse {
            animation: pulseZoom 2s infinite ease-in-out; /* 2s duration, repeats forever */
        }
        
        /* 4. CUSTOM MENU STYLES - Adapted for the new design */
        #menu-overlay {
            z-index: 150; 
            pointer-events: none; /* Allows clicks to pass through when hidden */
            background-color: transparent; /* Keep background transparent until needed for click detection */
            transition: background-color 0.3s;
        }
        #menu-overlay.active {
            pointer-events: auto; /* Re-enable clicks when active */
            background-color: rgba(0, 0, 0, 0.4); /* Add dark overlay when menu is open */
        }

        #menu-content {
            position: absolute;
            right: 2.5rem; /* Matches bottom-10 right-10 for the floating button */
            bottom: 2.5rem;
            transform: scale(0.8) translate(20%, 20%); /* Start smaller and offset */
            transform-origin: bottom right;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
            visibility: hidden; /* Hide initially */
            display: flex; /* Flex container for buttons */
            flex-direction: column; /* Stack buttons vertically */
            align-items: flex-end; /* Align to the right */
            gap: 10px; /* Space between menu buttons */
        }

        #menu-overlay.active #menu-content {
            transform: scale(1) translate(0, 0); /* Scale to 1 and no offset */
            opacity: 1;
            visibility: visible;
        }

        /* Style for simple buttons (Music/Close) */
        .menu-button {
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Align text and icon to the right */
            background-color: #6a8273; /* Sage color */
            color: #efc455; /* Gold-like color for text/icons */
            padding: 0.75rem 1.25rem;
            border-radius: 9999px; /* Fully rounded corners */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.2s;
            min-width: 180px; /* Ensure consistent width for buttons */
            text-align: right;
            cursor: pointer;
        }
        .menu-button:hover {
            background-color: #5b6e61; /* Darker sage on hover */
            transform: translateX(-5px); /* Slight hover effect */
        }
        .menu-button img, .menu-button svg {
            margin-left: 10px; /* Space between text and icon */
            filter: brightness(1.2); /* Make icons brighter */
        }
        
        /* Specific style for the Close button */
        #close-menu-button {
            background-color: #f87171; /* A reddish color for attention */
            color: white;
        }
        #close-menu-button:hover {
            background-color: #ef4444; 
        }
        #close-menu-button img, #close-menu-button svg {
             filter: none; /* Keep the icon color clean */
             transform: rotate(45deg); /* Rotate the + icon to X */
        }


        /* Specific style for the + button */
        #floating-menu-btn {
            background-color: #efc455; /* Gold color */
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            transition: transform 0.3s ease-in-out, background-color 0.2s;
            cursor: pointer;
        }
        #floating-menu-btn svg {
            color: white; /* Plus icon is white */
            stroke: white;
        }
        #floating-menu-btn.active {
            transform: rotate(135deg); /* Rotate the + to become an X */
            background-color: #d1b04a; /* Slightly darker gold when active */
        }
        
        /* New wrapper style for image-backed menu buttons */
        .menu-button-wrapper {
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            /* This is where the navigation logic lives for the image buttons */
        }
    </style>
</head>

    <script>
        // --- DATA AND INITIAL SETUP ---
        const GUEST_DATA_FILE = './guests.csv'; 

        document.addEventListener('DOMContentLoaded', () => {
            const videoSplash = document.getElementById('video-splash');
            const introVideo = document.getElementById('intro-video');
            const websiteContent = document.getElementById('website-content');
            
            // Reference to the background music audio element

            // References

            const heroHeader = document.querySelector('#hero-header');

            // NEW Menu References

            const menuContent = document.getElementById('menu-content');
            const musicToggleBtn = document.getElementById('music-toggle-btn');
            const speakerIcon = document.getElementById('speaker-icon');
            const musicStatus = document.getElementById('music-status');
            const closeMenuButton = document.getElementById('close-menu-button'); 
            
            // References for sections to show immediately
            const khmerInviteSection = document.getElementById('khmer-invite');
            const programSection = document.getElementById('program');
            
            let observer = null; 

            // **INITIALIZATION STEP:** Ensure the video is muted permanently
            introVideo.muted = true;
            
            // =========================================================================
            // CORE FUNCTION: LOAD GUEST NAME
            // =========================================================================
            async function loadGuestName() {
                // 1. Get the Code from the URL Hash (e.g., #0002 -> 0002)
                let guestCode = window.location.hash.substring(1).trim();
                
                let foundNameText = ' '; 
                let unlockButtonText = ' '; 

                // If a guest code is present, attempt to load the name
                if (guestCode) {
                    try {
                        const response = await fetch(GUEST_DATA_FILE);
                        
                        if (!response.ok) {
                            console.error(`Failed to load CSV: ${response.statusText}`);
                        } else {
                            const csvText = await response.text();
                            
                            // 3. Parse CSV and find the name
                            const lines = csvText.trim().split('\n');
                            let foundName = null;

                            for (const line of lines) {
                                const parts = line.trim().split(',', 2); 
                                
                                if (parts.length === 2 && parts[0].trim() === guestCode) {
                                    foundName = parts[1].trim();
                                    break;
                                }
                            }

                            if (foundName) {
                                foundNameText = foundName;
                                unlockButtonText = ' '; 
                            }
                        }

                    } catch (error) {
                        console.error('Error processing guest data:', error);
                    }
                }
                
                // 4. Update the Invitation Name Tag and Button Text
                tagNameList.innerHTML = foundNameText;
                unlockButton.innerHTML = unlockButtonText; 
                tagNameList.style.marginTop = guestCode ? '30px' : '0'; 
            }
            
            // =========================================================================
            // MUSIC CONTROL LOGIC
            // =========================================================================
            function updateMusicToggleUI() {
                if (bgMusic.muted) {
                    speakerIcon.src = './images/silence.png'; // Assuming you have a silence.png
                    speakerIcon.alt = 'Sound Off';
                    musicStatus.textContent = 'បិទសំឡេង'; // Muted in Khmer
                    bgMusic.pause();
                } else {
                    speakerIcon.src = './images/volume.png'; // Assuming you have a volume.png
                    speakerIcon.alt = 'Sound On';
                    musicStatus.textContent = 'កំពុងចាក់'; // Playing in Khmer
                    bgMusic.play().catch(e => console.warn("Music play failed:", e));
                }
            }

            musicToggleBtn.addEventListener('click', (event) => {
                event.stopPropagation(); // Prevent navigation/closing menu when toggling music
                bgMusic.muted = !bgMusic.muted;
                updateMusicToggleUI();
            });

            // =========================================================================
            // MENU NAVIGATION LOGIC
            // =========================================================================
            function openMenu() {
                floatingMenuBtn.classList.add('active'); // Rotate + icon
                menuOverlay.classList.remove('hidden');
                // Use a short delay to ensure the element is visible before adding 'active' for smooth transition
                setTimeout(() => {
                    menuOverlay.classList.add('active'); // Add transparent background and enable pointer events
                    document.body.style.overflow = 'hidden';
                    updateMusicToggleUI(); // Ensure the music status is correct when opening
                }, 10);
            }

            window.closeMenu = function() { // Expose globally for other elements if needed
                floatingMenuBtn.classList.remove('active'); // Rotate + icon back
                menuOverlay.classList.remove('active'); // Remove background and disable pointer events
                document.body.style.overflow = 'auto'; 
                setTimeout(() => menuOverlay.classList.add('hidden'), 300); // Wait for transition to complete before hiding
            }

            function navigateToSection(targetId) {
                const targetElement = document.getElementById(targetId);
                if (targetElement) {
                    closeMenu();
                    setTimeout(() => {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 350); // Wait for menu to close
                }
            }

            // Toggle floating menu button click handler
            floatingMenuBtn.addEventListener('click', (event) => {
                event.stopPropagation();
                if (menuOverlay.classList.contains('active')) {
                    closeMenu();
                } else {
                    openMenu();
                }
            });
            
            // Dedicated close button click handler
            closeMenuButton.addEventListener('click', closeMenu);
            
            // Reinstated: Close menu if clicking anywhere on the transparent background
            menuOverlay.addEventListener('click', (event) => {
                // Check if the click target is exactly the overlay itself, and not a child element (like a button)
                if (event.target === menuOverlay && menuOverlay.classList.contains('active')) {
                    closeMenu();
                }
            });
            
            // **MODIFIED** Event delegation for navigation: checks for both simple and image-backed buttons
            menuContent.addEventListener('click', (event) => {
                // Check for the new image-backed wrapper
                const wrapper = event.target.closest('.menu-button-wrapper');
                // Check for the old simple button (Music/Close)
                const simpleButton = event.target.closest('.menu-button');
                
                let target = null;
                
                if (wrapper) {
                    target = wrapper;
                } else if (simpleButton && simpleButton.dataset.target) {
                    // Only simple buttons with a data-target attribute should navigate
                    target = simpleButton;
                }
                
                if (target && target.dataset.target) {
                    navigateToSection(target.dataset.target);
                }
            });
            
            // =========================================================================
            // SCROLL ANIMATION (Fade-Up) LOGIC - Intersection Observer
            // =========================================================================
            function setupIntersectionObserver() {
                // Remove existing observer if any to prevent duplicates on reload/unlock
                if (observer) {
                    observer.disconnect();
                }

                const options = {
                    root: null, // viewport
                    rootMargin: '0px',
                    threshold: 0.1 // Trigger when 10% of the item is visible
                };

                observer = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting && entry.target.dataset.animate === 'fade-up') {
                            // Apply the visible state
                            entry.target.classList.remove('opacity-0', 'translate-y-8');
                            entry.target.classList.add('opacity-100', 'translate-y-0');
                            // Stop observing after the animation has run
                            observer.unobserve(entry.target);
                        }
                    });
                }, options);

                // Target all sections in the main content for observation
                document.querySelectorAll('main section[data-animate="fade-up"]').forEach(section => {
                    observer.observe(section);
                });
            }


            // =========================================================================
            // INTRO/UNLOCK LOGIC
            // =========================================================================

            function unlockWebsite() {
                // 1. Hide the hero-header contents (invitation card) and show main content
                heroHeader.style.minHeight = 'auto'; // Collapse the hero section
                heroHeader.style.padding = '0';
                document.querySelector('#invite').style.display = 'none';

                // 2. Hide hero video and show page 2 background video
                document.getElementById('hero-background-video').pause();
                document.getElementById('hero-background-video').style.display = 'none';
                
                videoBgPage2.classList.remove('hidden');
                document.getElementById('background-video').play(); 

                // 3. Show the main content and floating menu button
                mainContent.classList.remove('hidden');
                floatingMenuBtn.classList.remove('hidden', 'opacity-0');
                floatingMenuBtn.classList.add('opacity-100');
                
                // 4. Start music (unmute and play)
                bgMusic.muted = false;
                bgMusic.play().catch(e => console.warn("Music auto-play failed, user interaction may be required."));
                updateMusicToggleUI();

                // 5. Initialize the fade-up animations for the newly visible sections
                setupIntersectionObserver();

                // 6. Scroll down to the first section (Khmer Invite Card)
                setTimeout(() => {
                    const firstSection = document.getElementById('khmer-invite');
                    if (firstSection) {
                        firstSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100); // Short delay to ensure sections are visible
            }
            
            // Unlock button click handler
            unlockButton.addEventListener('click', () => {
                unlockWebsite();
            });

            // =========================================================================
            // MODAL LOGIC (for Gallery/Map images)
            // =========================================================================
            const galleryModal = document.getElementById('gallery-modal');
            const modalImage = document.getElementById('modal-image');

            window.openModal = function(imageSrc) {
                modalImage.src = imageSrc;
                galleryModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open
            }

            window.closeModal = function() {
                galleryModal.classList.add('hidden');
                document.body.style.overflow = 'auto'; 
            }

            // =========================================================================
            // INTRO VIDEO LOGIC (Autoplay/Splash Screen)
            // =========================================================================

            // Function to handle the start of the website experience
            function startWebsiteExperience() {
                 // Check if video is loaded and ready to play
                if (introVideo.readyState >= 3 || introVideo.error) {
                    // Hide the splash/video overlay
                    videoSplash.style.opacity = '0';
                    setTimeout(() => {
                        videoSplash.classList.add('hidden');
                        document.body.style.overflow = 'auto'; // Re-enable scrolling
                    }, 1000); 

                    // Show the main content
                    websiteContent.style.opacity = '1';

                    // Start the music (muted initially as per the HTML attribute)
                    bgMusic.play().catch(e => console.warn("Muted music play failed: ", e));

                    // Load the custom guest name
                    loadGuestName();
                } else {
                     // Wait for 'canplaythrough' or 'loadeddata'
                    introVideo.addEventListener('canplaythrough', startWebsiteExperience, { once: true });
                    introVideo.addEventListener('loadeddata', startWebsiteExperience, { once: true });
                }
            }


            // This is the first thing that happens on DOMContentLoaded
            // 1. Show the video splash and lock body scrolling
            videoSplash.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
            
            // 2. Play the video (it's muted and set to autoplay in HTML)
            // Note: Mobile browsers might still block play until user interaction.
            introVideo.play().catch(e => {
                console.warn("Intro video autoplay blocked. Transitioning to static content.");
                // Fallback if autoplay is blocked: directly start website experience
                startWebsiteExperience(); 
            });

            // 3. Set a timeout to proceed after a few seconds even if video playback issues occur
            // A hard time limit ensures the user isn't stuck waiting for a resource that might fail.
            setTimeout(() => {
                // Only execute if the splash is still visible (i.e., startWebsiteExperience hasn't run yet)
                if (videoSplash.style.opacity !== '0') {
                    startWebsiteExperience();
                }
            }, 4000); // 4 seconds delay max for the intro video

            // 4. On video end, transition to the main content
            introVideo.onended = () => {
                startWebsiteExperience();
            };

            // Ensure website content starts fully transparent to fade in later
            websiteContent.style.opacity = '0'; 

        });
    </script>
