<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mobile-Only Wedding Invitation</title>

  <!-- Load Moul font -->
  <link href="https://fonts.googleapis.com/css2?family=Moul&display=swap" rel="stylesheet" />

  <!-- Preload assets -->
  <link rel="preload" as="video" href="./video/bg_vdo_02.webm" type="video/webm" />
  <link rel="preload" as="video" href="./video/bg_program.webm" type="video/webm" />
  <link rel="preload" as="video" href="./video/intro.mov" type="video/quicktime" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Stage centers and scales the phone on desktop -->
  <div id="stage">
    <div id="mobile-wrapper">
      <!-- ============== PAGE 1: HERO (tap to open) ============== -->
      <header id="hero-header" class="relative">
        <div id="video-wrapper" aria-hidden="true">
          <video id="bg-video" autoplay loop muted playsinline preload="auto" poster="./images/video_poster.jpg">
            <source src="./video/bg_003.mp4" type="video/webm" />
            Your browser does not support the video tag.
          </video>
        </div>

        <section id="invite">
          <img src="./images/Invite_new.png" alt="Invitation cover" loading="eager" />


          <div id="names-background-box" aria-live="polite">
              <p id="tag_name_list">កំពុងផ្ទុក...</p>
            </div>
            
          <div id="content-overlay" role="button" tabindex="0" aria-label="Open invitation">
            <div style="margin-bottom: -25px;" id="button-background-box" class="animate-zoom-pulse" aria-hidden="true"></div>
          </div>
        </section>
      </header>

      <!-- ============== INTRO VIDEO LAYER (appears after first click) ============== -->
      <div id="intro-video-layer" class="hidden">
        <video id="intro-video" playsinline preload="auto">
          <source src="./video/intro.mov" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <button id="intro-skip" aria-label="Skip intro">Skip ›</button>
      </div>

      <!-- ============== PAGE 2: VIDEO BACKDROP (FIXED BEHIND CONTENT) ============== -->
      <div id="video-bg-page2" class="hidden">
        <video id="background-video" autoplay loop muted playsinline>
          <source src="./video/bg_003.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <div class="overlay"></div>
      </div>

      <!-- ============== PAGE 2: HERO (kept but not used in this flow) ============== -->
      <header id="hero-header-2" class="relative hidden">
        <div class="absolute-fill" aria-hidden="true">
          <video id="hero-background-video" autoplay loop muted playsinline class="cover">
            <source src="./video/bg_003.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>

        <section id="invite-2" class="relative-layer">
          <img src="./images/Invite_new.png" alt="Invitation Image" />
          <div class="overlay-stack">
            <div id="names-background-box-2" class="namecard" style="max-width:80%;">
              <p id="tag_name_list_2" class="name-text">កំពុងផ្ទុក...</p>
            </div>
            <div id="button-background-box-2" class="cta-big animate-zoom-pulse">
              <button id="unlock-sections-button" aria-label="Show details"></button>
            </div>
          </div>
        </section>
      </header>

      <!-- ============== PAGE 2: MAIN CONTENT (ALL SECTIONS IN ONE PAGE) ============== -->
      <main id="page2-main" class="hidden">
        <!-- Section 2.1 Khmer Invite -->
        <section id="khmer-invite" class="invite-card" data-reveal>
          <img src="./images/wedding_update.png" alt="សំបុត្រអញ្ជើញ" loading="lazy" />
          <div class="cta-row">
            <div class="cta-big animate-zoom-pulse" style="background-image:url('./images/btn_save.png')">
              <a
                href="https://calendar.google.com/calendar/event?action=TEMPLATE&tmeid=NTFia241cW1rMzZvcjFmczZ0dmlhc29yaDdfMjAyNjAxMTFUMTAwMDAwWiBrZW9zYXR5QG0&tmsrc=keosaly%40gmail.com&scp=ALL"
                target="_blank" rel="noopener noreferrer"
              >
                <button id="save-date-button" aria-label="Save the date to Google Calendar"></button>
              </a>
            </div>
          </div>
        </section>

        <!-- Section 2.2 Program -->
        <section id="program" class="invite-card" data-reveal>
          <img src="./images/program_update.png" alt="Program" loading="lazy" />
        </section>

        <!-- Section 2.3 Venue (Map) -->
        <section id="venue" class="invite-card" data-reveal>
          <img src="./images/map_card.png" alt="Map Card" loading="lazy" />
          <div class="cta-row bottom-tight">
            <div class="cta-big animate-zoom-pulse" style="background-image:url('./images/btn_map.png')">
              <a href="https://maps.app.goo.gl/3DtryAv9kyWQXQoP8?g_st=ipc" target="_blank" rel="noopener noreferrer">
                <button id="open-map-button" aria-label="Open Google Map"></button>
              </a>
            </div>
          </div>
        </section>

        <!-- Section 2.4 Bank (ABAs) -->
        <section id="bank" class="invite-card" data-reveal>
          <img src="./images/aba_card.png" alt="ABA Card" loading="lazy" />
          <div class="aba-inline">
            <a href="./images/aba.JPG" target="_blank" title="View ABA QR Code 1" class="qr-thumb">
              <img src="./images/aba.JPG" alt="ABA QR 1" />
            </a>
            <a href="./images/aba2.JPG" target="_blank" title="View ABA QR Code 2" class="qr-thumb">
              <img src="./images/aba2.JPG" alt="ABA QR 2" />
            </a>
          </div>
        </section>

        <!-- Section 2.5 Gallery -->
        <section id="gallery" class="gallery-card" data-reveal>
          <div class="gallery-inner">
            <h2 class="gallery-title">រូបថតអនុស្សាវរីយ៍</h2>
            <p class="gallery-sub">ដំណើរកម្សាន្តរបស់យើង</p>

            <div class="gallery-grid">
              <img src="./images/img_001.JPG"  alt="Gallery Photo 1" class="gallery-thumbnail" />
              <img src="./images/img_002.jpeg" alt="Gallery Photo 2" class="gallery-thumbnail" />
              <img src="./images/img_03.jpeg"  alt="Gallery Photo 3" class="gallery-thumbnail" />
              <img src="./images/img_004.JPG"  alt="Gallery Photo 4" class="gallery-thumbnail" />
              <img src="./images/us_01.png"   alt="Gallery Photo 5" class="gallery-thumbnail" />
              <img src="./images/us_01.png"   alt="Gallery Photo 6" class="gallery-thumbnail" />
            </div>

            <a href="#gallery" class="gallery-more">មើលរូបភាពទាំងអស់ (View All Photos)</a>
          </div>
        </section>
      </main>

      <!-- ============== POPUP ICON MENU (ONLY PAGE 2) ============== -->
      <button
        id="menu-toggle"
        class="menu-fab hidden"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="popup-menu"
      >
        ☰
      </button>

      <nav id="popup-menu" class="popup-menu hidden" aria-label="Section menu">
        <button class="menu-item" data-target="khmer-invite">
          <span class="menu-icon">💌</span>
          <span class="menu-text">សំបុត្រ</span>
        </button>
        <button class="menu-item" data-target="program">
          <span class="menu-icon">📅</span>
          <span class="menu-text">កម្មវិធី</span>
        </button>
        <button class="menu-item" data-target="venue">
          <span class="menu-icon">📍</span>
          <span class="menu-text">ទីតាំង</span>
        </button>
        <button class="menu-item" data-target="bank">
          <span class="menu-icon">💳</span>
          <span class="menu-text">ធនាគារ</span>
        </button>
        <button class="menu-item" data-target="gallery">
          <span class="menu-icon">📷</span>
          <span class="menu-text">រូបភាព</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Gallery Modal -->
  <div id="gallery-modal" class="modal hidden" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="modal-image" src="" alt="Zoomed Gallery Image" />
      <button id="close-modal-btn" class="modal-close" aria-label="Close Modal" onclick="closeModal()">×</button>
      <button id="prev-btn" class="modal-nav left" aria-label="Previous Image">‹</button>
      <button id="next-btn" class="modal-nav right" aria-label="Next Image">›</button>
    </div>
  </div>

  <noscript>Please enable JavaScript to view the invitation.</noscript>
  <script src="script.js"></script>
</body>
</html>
