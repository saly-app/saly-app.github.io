<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile-Only Website</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Embedding quick CSS for animation used in HTML structure */
        @keyframes zoom-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-zoom-pulse {
            animation: zoom-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="mobile-wrapper">
        
        <header id="hero-header" class="relative min-h-screen bg-transparent flex flex-col justify-center items-center text-center p-6 border-b border-black-100">
                    
            <div id="video-wrapper" class="absolute inset-0 z-[0] after:content-[''] after:absolute after:inset-0 after:bg-black/0"> 
                <video id="hero-background-video" autoplay loop muted playsinline class="w-full h-full object-cover">
                    <source src="./video/bg_vdo_02.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>

            <section id="invite" class="relative z-10 py-0 max-w-xl mx-auto mb-12">
                
                <img src="./images/Invite_new.png" 
                    style="width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit;" 
                    alt="Invitation Image">

                <div id="content-overlay" class="absolute inset-0 flex flex-col items-center text-center">
                    <div id="names-background-box" 
                        style="
                            position: absolute; 
                            top: 50%; left: 50%; transform: translate(-50%, -50%); 
                            background-image: url('./images/btn_namecard2.png'); 
                            background-size: contain; background-repeat: no-repeat; 
                            background-position: center; margin: 0; max-width: 80%;
                            display: flex; align-items: center; justify-content: center;
                        ">

                        <p id="tag_name_list" style="font-family:'Moul'; color: #efc455;">
                            កំពុងផ្ទុក...
                        </p>
                    </div>
                    <div id="button-background-box"
                        class="mt-auto animate-zoom-pulse"
                        style="
                            background-image: url('./images/btn_open.png');
                            background-size: contain; background-repeat: no-repeat; 
                            background-position: center;
                            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
                        ">
                        <button  id="unlock-sections-button" class="cta-button" 
                            style="
                                width: 100%; height: 100%;
                                background-color: transparent !important; color: #5b5b5b; 
                                padding: 0; border: none; cursor: pointer;
                            ">
                        </button>
                    </div>
                </div>
                
            </section>
        </header>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
